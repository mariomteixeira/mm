services:
  mysql:
    image: mysql:8.0
    container_name: mm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mm
      MYSQL_USER: mm
      MYSQL_PASSWORD: mm
      MYSQL_ROOT_PASSWORD: mm_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mm", "-pmm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
