services:
  mysql:
    image: mysql:8.0
    container_name: mm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mm
      MYSQL_USER: mm
      MYSQL_PASSWORD: mm
      MYSQL_ROOT_PASSWORD: mm_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mm", "-pmm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm-app
    restart: unless-stopped
    command: sh -lc "[ -d node_modules/.bin ] || npm ci && npm run db:generate && npm run db:migrate:deploy && npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://mm:mm@mysql:3306/mm
      REDIS_URL: redis://redis:6379
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules_app:/app/node_modules
      - app_next_cache:/app/.next

  worker-llm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm-worker-llm
    restart: unless-stopped
    command: sh -lc "[ -d node_modules/.bin ] || npm ci && npm run db:generate && npm run worker:llm"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://mm:mm@mysql:3306/mm
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - app_node_modules_worker_llm:/app/node_modules

  worker-drafts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mm-worker-drafts
    restart: unless-stopped
    command: sh -lc "[ -d node_modules/.bin ] || npm ci && npm run db:generate && npm run worker:drafts"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://mm:mm@mysql:3306/mm
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - app_node_modules_worker_drafts:/app/node_modules

volumes:
  mysql_data:
  redis_data:
  app_node_modules_app:
  app_node_modules_worker_llm:
  app_node_modules_worker_drafts:
  app_next_cache:
